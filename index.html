<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>AR Video Experience</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    .a-enter-vr, .a-enter-ar, .a-orientation-modal, .a-modal, #a-scene-container { 
      display: none !important; 
      visibility: hidden !important; 
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    #audio-toggle-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 10000;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 12px 18px;
      border-radius: 50px;
      font-size: 14px;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #audio-toggle-btn:active {
      transform: scale(0.95);
    }
  </style>
  <script>
    let isGlobalMuted = false;
    AFRAME.registerComponent("ar-video-controller", {
      schema: {
        video: { type: "selector" },
        autoPlay: { type: "boolean", default: true }
      },
      init: function () {
        const vid = this.data.video;
        if (!vid) return;
        this.el.addEventListener("targetFound", () => {
          if (this.data.autoPlay) {
            vid.muted = isGlobalMuted;
            vid.play().catch(e => console.log("Waiting for user tap:", e));
          }
        });
        this.el.addEventListener("targetLost", () => {
          vid.pause();
        });
      }
    });
    function toggleAudio() {
      isGlobalMuted = !isGlobalMuted;
      const vids = document.querySelectorAll("video");
      vids.forEach(v => { v.muted = isGlobalMuted; });
      const btn = document.getElementById("audio-toggle-btn");
      if (btn) {
        btn.innerHTML = isGlobalMuted 
          ? "<span>🔇</span><span>صدا: خاموش</span>" 
          : "<span>🔊</span><span>صدا: روشن</span>";
      }
    }
  </script>
</head>

  <button id="audio-toggle-btn" onclick="toggleAudio()">
