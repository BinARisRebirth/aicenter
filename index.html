<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Experience</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  <style>
    .a-enter-vr, .a-enter-ar, .a-orientation-modal, .a-modal, #a-scene-container { display: none !important; visibility: hidden !important; }
    body { margin: 0; padding: 0; overflow: hidden; }
    #soundToggleBtn { touch-action: manipulation; } #soundToggleBtn:active { transform: scale(0.94); }
  </style>
  <script>
    AFRAME.registerComponent("auto-turn", {
      schema: { speed: { default: 40 } },
      tick: function (t, dt) {
        if (!dt) return;
        const rot = this.el.getAttribute("rotation");
        this.el.setAttribute("rotation", {
          x: rot.x,
          y: rot.y + (this.data.speed * dt) / 1000,
          z: rot.z
        });
      }
    });

    AFRAME.registerComponent("touch-turn", {
      init: function () {
        let isDown = false, lastX = 0, lastY = 0;
        const onStart = (cx, cy) => { isDown = true; lastX = cx; lastY = cy; };
        const onMove = (cx, cy) => {
          if (!isDown) return;
          const dx = cx - lastX, dy = cy - lastY;
          const rot = this.el.getAttribute("rotation");
          this.el.setAttribute("rotation", {
            x: rot.x - dy * 0.35,
            y: rot.y + dx * 0.35,
            z: rot.z
          });
          lastX = cx; lastY = cy;
        };
        const onEnd = () => { isDown = false; };

        window.addEventListener("touchstart", (e) => { if (e.touches.length === 1) onStart(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
        window.addEventListener("touchmove", (e) => { if (e.touches.length === 1) onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
        window.addEventListener("touchend", onEnd);

        window.addEventListener("mousedown", (e) => onStart(e.clientX, e.clientY));
        window.addEventListener("mousemove", (e) => onMove(e.clientX, e.clientY));
        window.addEventListener("mouseup", onEnd);
      }
    });

    // کنترلر انیمیشن سبک و مطمئن برای A-Frame 1.5.0 + MindAR 1.2.5
    // اگر aframe-extras بارگذاری نشده باشد، یک animation-mixer داخلی جایگزین می‌شود؛
    // در هر حالت پخش/توقف دقیق با targetFound/targetLost مدیریت می‌شود.
    (function () {
      function registerFallbackMixer() {
        if (AFRAME.components["animation-mixer"]) return; // نسخه extras موجود است
        console.warn("aframe-extras animation-mixer not found — using built-in fallback mixer");
        AFRAME.registerComponent("animation-mixer", {
          schema: { clip: { default: "*" }, loop: { default: "repeat" }, timeScale: { default: 1 }, crossFadeDuration: { default: 0.3 } },
          init: function () { this.mixer = null; this.actions = {}; this.applied = false; },
          update: function () {
            const el = this.el;
            el.addEventListener("model-loaded", () => this.build(), { once: true });
            if (el.getObject3D("mesh")) this.build();
          },
          build: function () {
            const mesh = this.el.getObject3D("mesh");
            if (!mesh) return;
            const clips = mesh.animations || (mesh.children && mesh.children[0] && mesh.children[0].animations) || [];
            if (!clips.length) return;
            this.mixer = new THREE.AnimationMixer(mesh);
            const wanted = this.data.clip === "*" ? clips.map(c => c.name) : [this.data.clip];
            wanted.forEach(name => {
              const clip = THREE.AnimationClip.findByName(clips, name);
              if (!clip) return;
              const action = this.mixer.clipAction(clip);
              action.setLoop(this.data.loop === "once" ? THREE.LoopOnce : THREE.LoopRepeat, Infinity);
              action.clampWhenFinished = false;
              action.timeScale = this.data.timeScale;
              action.play();
              this.actions[name] = action;
            });
          },
          tick: function (t, dt) { if (this.mixer) this.mixer.update(dt / 1000); },
          remove: function () { if (this.mixer) this.mixer.stopAllAction(); }
        });
      }
      registerFallbackMixer();

      // پخش/توقف انیمیشن بر اساس وضعیت تارگت MindAR (با fallback داخلی)
      AFRAME.registerComponent("anim-playback", {
        schema: { autoplay: { default: true }, speed: { default: 1 } },
        init: function () {
          const el = this.el;
          const target = el.closest("[mindar-image-target]");
          if (!target) return;
          const setScale = (v) => {
            if (el.components["animation-mixer"]) {
              el.setAttribute("animation-mixer", "timeScale", v);
            }
            const mixer = el.components["animation-mixer"] && el.components["animation-mixer"].mixer;
            if (mixer) mixer.timeScale = v;
          };
          target.addEventListener("targetFound", () => { if (this.data.autoplay) setScale(this.data.speed); });
          target.addEventListener("targetLost", () => setScale(0));
          if (!this.data.autoplay) setScale(0);
        }
      });
    })();

    let isGlobalMuted = false;
    AFRAME.registerComponent("ar-video-controller", {
      schema: {
        video: { type: "selector" },
        autoPlay: { type: "boolean", default: true }
      },
      init: function () {
        const vid = this.data.video;
        if (!vid) return;
        const target = this.el;
        target.addEventListener("targetFound", () => {
          if (this.data.autoPlay) {
            vid.muted = isGlobalMuted;
            vid.play().catch(e => console.log("Waiting for user tap:", e));
          }
        });
        target.addEventListener("targetLost", () => {
          vid.pause();
        });
      }
    });

    // مدیریت دقیق مدیا: قطع کامل صدا تا زمان پیدا شدن قطعی تارگت
    AFRAME.registerComponent("media-controller", {
      schema: {
        type: { default: "video" },
        src: { default: "" },
        loop: { default: true }
      },
      init: function () {
        const el = this.el;
        const targetEntity = el.closest("[mindar-image-target]");
        if (!targetEntity) return;

        let mediaEl = null;
        window.__arMediaEls = window.__arMediaEls || [];

        if (this.data.type === "video") {
          mediaEl = document.createElement("video");
          mediaEl.src = this.data.src;
                    mediaEl.loop = (this.data.loop === true || this.data.loop === "true");
          mediaEl.playsInline = true;
          mediaEl.muted = true;
          mediaEl.preload = "auto";
          mediaEl.pause();
          mediaEl.currentTime = 0;

          window.__arMediaEls.push(mediaEl);

          const texture = new THREE.VideoTexture(mediaEl);
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;

          el.addEventListener("loaded", () => {
            const mesh = el.getObject3D("mesh");
            if (mesh && mesh.material) {
              mesh.material.map = texture;
              mesh.material.needsUpdate = true;
            }
          });
        } else if (this.data.type === "audio") {
          mediaEl = new Audio(this.data.src);
          mediaEl.muted = true;
          mediaEl.loop = (this.data.loop === true || this.data.loop === "true");
          mediaEl.preload = "auto";
          mediaEl.pause();
          mediaEl.currentTime = 0;
          window.__arMediaEls.push(mediaEl);
        }

        targetEntity.addEventListener("targetFound", () => {
          if (mediaEl) {
            const p = mediaEl.play();
            if (p !== undefined) {
              p.catch(() => {
                const unlock = () => { mediaEl.play(); window.removeEventListener("touchstart", unlock); window.removeEventListener("click", unlock); };
                window.addEventListener("touchstart", unlock, { once: true });
                window.addEventListener("click", unlock, { once: true });
              });
            }
          }
        });

        targetEntity.addEventListener("targetLost", () => {
          if (mediaEl) mediaEl.pause();
        });
      }
    });
  </script>
</head>
<body>
  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>
      <video id="vid-0" src="videos/videos1.mp4" preload="auto" crossorigin="anonymous" webkit-playsinline playsinline loop></video>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    
    <a-entity mindar-image-target="targetIndex: 0">
      
      <a-entity position="0 0 0.1" rotation="0 0 0" scale="0.5 0.5 0.5" auto-turn="speed: 40" touch-turn>
        <a-gltf-model src="models/models1.glb" animation-mixer="clip: *; loop: repeat; timeScale: 1; crossFadeDuration: 0.3" anim-playback="autoplay: true; speed: 1"></a-gltf-model>
      </a-entity>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 1">
      
      <a-entity position="0 0 0.1" rotation="0 0 0" scale="0.5 0.5 0.5" ar-video-controller="video: #vid-0; autoPlay: true">
        <a-plane src="#vid-0" width="0.80" height="0.45" material="shader: flat; transparent: true; opacity: 1; side: double"></a-plane>
      </a-entity>
    </a-entity>
  </a-scene>
  <button id="audio-toggle-btn" onclick="toggleAudio()">
    <span>🔊</span>
    <span>صدا: روشن</span>
  </button>
  <style>
    #audio-toggle-btn {
      position: fixed; bottom: 24px; right: 24px; z-index: 10000;
      background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff; padding: 12px 18px; border-radius: 50px; font-size: 14px;
      font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center;
      gap: 8px; cursor: pointer; backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4); transition: all 0.2s ease;
      user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    #audio-toggle-btn:active { transform: scale(0.95); }
  </style>
  <script>
    function toggleAudio() {
      isGlobalMuted = !isGlobalMuted;
      document.querySelectorAll("video").forEach(v => { v.muted = isGlobalMuted; });
      (window.__arMediaEls || []).forEach(e => { e.muted = isGlobalMuted; });
      const btn = document.getElementById("audio-toggle-btn");
      if (btn) {
        btn.innerHTML = isGlobalMuted
          ? "<span>🔇</span><span>صدا: خاموش</span>"
          : "<span>🔊</span><span>صدا: روشن</span>";
      }
    }
  </script>
</body>
</html>
